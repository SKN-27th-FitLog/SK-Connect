services:
  db:
    image: postgres:16
    container_name: sk_connect_db

    environment:
      POSTGRES_DB: service
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./data:/docker-entrypoint-initdb.d/data

volumes:
  postgres_data:
