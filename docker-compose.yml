services:
  db:
    image: postgres:16
    container_name: sk_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: service
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sk_connect_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      - db

volumes:
  postgres_data:
