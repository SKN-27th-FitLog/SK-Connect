[project]
name = "kag-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "kiwipiepy>=0.21.0",
  "neo4j>=5.20.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
